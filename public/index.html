<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝙼𝙰𝙽𝙸 𝚇𝙳 ☏ - QR Pairing Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        .brand-font {
            font-family: 'Orbitron', sans-serif;
        }
        .qr-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid #334155;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.2);
        }
        .animate-pulse-custom {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full text-center">
        <h1 class="text-4xl brand-font font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-violet-500">
            𝙼𝙰𝙽𝙸 𝚇𝙳 ☏
        </h1>
        <img src="/assets/manix-md-banner.png" alt="𝙼𝙰𝙽𝙸 𝚇𝙳 ☏" class="w-full h-32 object-cover rounded-xl mb-4 opacity-90">
        <p class="text-slate-400 mb-2">WhatsApp Multi-Device Pairing System</p>
        <p class="text-slate-500 text-xs mb-6">𝙼𝙰𝙽𝙸 𝚇𝙳 ☏ WhatsApp Channel and Support</p>

        <div class="qr-container rounded-2xl p-8 mb-8">
            <div id="qr-status" class="mb-4 text-sm font-semibold text-pink-500 animate-pulse-custom">
                Connecting to server...
            </div>
            
            <div class="flex justify-center items-center bg-white p-4 rounded-xl mb-4 min-h-[250px]">
                <img id="qr-code" src="" alt="QR Code" class="hidden max-w-full h-auto">
                <div id="qr-placeholder" class="text-slate-400 flex flex-col items-center">
                    <svg class="animate-spin h-10 w-10 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Generating QR Code...</span>
                </div>
            </div>

            <div id="connection-details" class="text-xs text-slate-500">
                Open WhatsApp → Linked Devices → Link a Device → scan this QR
            </div>
        </div>

        <div class="flex flex-col gap-4 text-sm">
            <div class="flex gap-2 justify-center">
                <a href="https://whatsapp.com/channel/0029Vb8XvFqD8SDvDPkdqG1f" target="_blank" rel="noopener" class="px-3 py-2 rounded-lg bg-green-600 hover:bg-green-500 text-white">📲 WhatsApp Channel</a>
                <a href="https://wa.me/9779807044421" target="_blank" rel="noopener" class="px-3 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-white">☎ Contact</a>
            </div>
            <div class="flex items-center justify-between p-3 bg-slate-800/50 rounded-lg border border-slate-700">
                <span>System Status</span>
                <span id="system-status" class="text-yellow-300 flex items-center">
                    <span id="system-status-dot" class="h-2 w-2 bg-yellow-300 rounded-full mr-2"></span>
                    Checking WhatsApp...
                </span>
            </div>
            <p class="text-slate-500 text-xs italic">
                𝙼𝙰𝙽𝙸 𝚇𝙳 ☏ · wa.me/9779807044421
            </p>
        </div>
    </div>

    <script>
        const socket = io();
        const qrImg = document.getElementById('qr-code');
        const qrPlaceholder = document.getElementById('qr-placeholder');
        const qrStatus = document.getElementById('qr-status');
        const systemStatus = document.getElementById('system-status');
        const systemStatusDot = document.getElementById('system-status-dot');

        function setSystemStatus(isConnected, label) {
            systemStatus.className = `flex items-center ${isConnected ? 'text-green-400' : 'text-yellow-300'}`;
            systemStatusDot.className = `h-2 w-2 rounded-full mr-2 ${isConnected ? 'bg-green-400 animate-ping' : 'bg-yellow-300'}`;
            systemStatus.lastChild.textContent = ` ${label}`;
        }

        socket.on('qr', (qrDataURL) => {
            qrImg.src = qrDataURL;
            qrImg.classList.remove('hidden');
            qrPlaceholder.classList.add('hidden');
            qrStatus.innerText = 'Scan the QR Code to pair';
            qrStatus.classList.remove('text-pink-500', 'text-green-400');
            qrStatus.classList.add('text-violet-400');
            setSystemStatus(false, 'Waiting for QR scan');
        });

        socket.on('status', (status) => {
            qrStatus.innerText = status;
            if (!status.toLowerCase().includes('connected')) setSystemStatus(false, status);
        });

        socket.on('connected', (isConnected) => {
            setSystemStatus(Boolean(isConnected), isConnected ? 'WhatsApp connected' : 'WhatsApp not paired');
            if (isConnected) {
                qrStatus.innerText = 'Connected Successfully!';
                qrStatus.classList.remove('text-violet-400');
                qrStatus.classList.add('text-green-400');
                qrImg.style.opacity = '0.5';
            } else {
                qrImg.style.opacity = '1';
            }
        });

        socket.on('connect_error', () => setSystemStatus(false, 'Dashboard connected; WhatsApp status unknown'));
    </script>
</body>
</html>
